[package]
name = "outlass"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compiles SCSS (and indented Sass / lass) into Luau code that builds a Roblox StyleSheet"

[workspace]
members = ["web"]

[[bin]]
name = "outlass"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
glob = "0.3"
