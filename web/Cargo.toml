[package]
name = "outlass-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "WebAssembly bindings for the outlass playground"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
outlass = { path = ".." }
wasm-bindgen = "0.2"
js-sys = "0.3"

# wasm-pack's wasm-opt is older than the wasm features rustc enables by default and fails to
# parse the module; re-enable once a newer binaryen is installed.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
